<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Rosetta Tone Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: a colour-bar instrument sized to one tablet screen. Fixed header, one working surface that scrolls inside itself, tap any code for a bottom sheet. The tone wheel rotates so the chosen family sits at 6 o'clock. */
:root{
  --bg:#eceeed; --panel:#f8f9f8; --ink:#1b2023; --muted:#5d666b; --line:#cfd5d4; --accent:#5a3654; --warn:#a2461c; --warn-bg:#f6e3d8; --shade:#d9dedd; --hi:#ece0e9; --good:#2f7a55; --bad:#b23a3a; --amber:#c98a12;
  --f-display:"Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --f-body:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-code:"IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r:6px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#15191b; --panel:#1d2225; --ink:#e7ebea; --muted:#9aa4a8; --line:#323a3e; --accent:#c99bbf; --warn:#f0a57e; --warn-bg:#3a2419; --shade:#0f1214; --hi:#33252f; --good:#3f9a6e; --bad:#c45454; --amber:#e0a63a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#15191b; --panel:#1d2225; --ink:#e7ebea; --muted:#9aa4a8; --line:#323a3e; --accent:#c99bbf; --warn:#f0a57e; --warn-bg:#3a2419; --shade:#0f1214; --hi:#33252f; --good:#3f9a6e; --bad:#c45454; --amber:#e0a63a; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
body.framed{background:var(--shade);overflow:auto;height:auto;min-height:100%}
.app{height:100%;display:flex;flex-direction:column;position:relative;background:var(--bg);overflow:hidden}
body.framed .app{width:1180px;height:820px;margin:28px auto 40px;border-radius:22px;border:1px solid var(--line);box-shadow:0 18px 50px rgba(0,0,0,.18)}
.framecap{display:none;text-align:center;font:500 12px var(--f-code);color:var(--muted);padding-top:14px}
body.framed .framecap{display:block}
body.framed.phone .app{width:390px;height:min(844px,calc(100vh - 96px));border-radius:44px;border:10px solid #141110;box-shadow:0 24px 60px -18px rgba(0,0,0,.45);margin:14px auto 30px}
.devbar{position:fixed;right:14px;bottom:14px;z-index:60;display:flex;align-items:center;gap:2px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:3px;box-shadow:0 4px 16px rgba(0,0,0,.14);font:500 12px var(--f-body)}
.devbar[hidden]{display:none}.devbar span{color:var(--muted);padding:0 8px 0 10px}
.devbar button{border:0;background:transparent;color:var(--ink);font:inherit;padding:5px 11px;border-radius:999px;cursor:pointer}
.devbar button[aria-pressed="true"]{background:var(--ink);color:var(--panel)}
.navscroll{display:contents}
.app.nar header .row:first-child{flex-wrap:wrap;gap:8px 10px;padding-block:8px}
.app.nar header .row:first-child>h1{flex:1;font-size:18px}
.app.nar .spacer{display:none}
.app.nar .navscroll{display:flex;order:3;flex:1 1 100%;gap:8px;overflow-x:auto;scrollbar-width:none;margin-inline:-16px;padding-inline:16px}
.app.nar .navscroll::-webkit-scrollbar,.app.nar #filterRow::-webkit-scrollbar{display:none}
.app.nar .navscroll>*{flex:none}
.app.nar .seg button{white-space:nowrap;padding:7px 11px}
.app.nar #filterRow{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;gap:8px}
.app.nar #filterRow>*{flex:none}.app.nar #filterRow .chips{flex-wrap:nowrap}
.app.nar .savedwrap{grid-template-columns:minmax(0,1fr)}
.app.nar .xres{grid-template-columns:minmax(0,1fr)}.app.nar .xarrow{transform:rotate(90deg)}
.app.nar .famtabs{display:flex;overflow-x:auto;gap:6px;padding-bottom:8px}.app.nar .chart{min-width:0}
.app.nar .sheet .wrap{grid-template-columns:minmax(0,1fr)}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body.framed .wrap{padding-left:20px;padding-right:20px}
header{flex:none;background:var(--panel);border-bottom:1px solid var(--line)}
header .row{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;padding-block:9px}
header .row+.row{border-top:1px solid var(--line);padding-block:7px}
h1{font-family:var(--f-display);font-weight:700;font-size:22px;margin:0;letter-spacing:-.01em}
h2{font-family:var(--f-display);font-weight:700;font-size:22px;margin:0 0 4px;text-wrap:balance}
h3{font-family:var(--f-display);font-weight:500;font-size:17px;margin:0 0 6px}
.seg{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.seg button{border:0;background:transparent;color:var(--ink);font:500 13.5px var(--f-body);padding:7px 12px;cursor:pointer}
header .row:first-child{flex-wrap:nowrap}header .row:first-child>*{flex:none}header h1{font-size:20px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--panel)}
.spacer{flex:1}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:999px;font:500 13px var(--f-body);padding:5px 11px;cursor:pointer;display:inline-flex;gap:6px;align-items:center;text-decoration:none}
.chip[aria-pressed="true"]{border-color:var(--ink);color:var(--ink);background:var(--bg)}
.chip .k{font:600 11px var(--f-code);min-width:18px;height:18px;border-radius:9px;display:inline-grid;place-items:center;background:var(--line);color:var(--ink);padding:0 3px}
.chip[aria-pressed="true"] .k{background:var(--ink);color:var(--panel)}
.chip small{font-size:11px;color:var(--muted)}
.lbl{font:600 10.5px var(--f-body);letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{flex:1;min-height:0;overflow:auto;padding-block:14px 40px}
main.fit{overflow:hidden;padding-block:12px}
.note{font-size:13px;color:var(--muted);max-width:70ch;margin:4px 0}
.warn{background:var(--warn-bg);color:var(--warn);border-radius:var(--r);padding:8px 12px;font-size:13px}
code,.code{font-family:var(--f-code)}
.mini{display:inline-block;width:14px;height:14px;border-radius:3px;vertical-align:-3px;margin-right:5px;box-shadow:inset 0 0 0 1px rgba(127,127,127,.3)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;min-width:0}
.scroll{overflow-x:auto;max-width:100%}
table{border-collapse:collapse;font-size:13.5px;width:100%}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font:600 10.5px var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
td.num{font-family:var(--f-code);font-variant-numeric:tabular-nums}
tr.clash td:first-child{color:var(--warn);font-weight:600}
.fam{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.fam i{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}
/* wheel */
.wheelgrid{display:grid;gap:18px;align-items:start}
.wheelgrid.wide{height:100%}
.wheelbox svg{display:block;width:100%;height:auto}
.wheelcol{display:flex;flex-direction:column;gap:8px;min-width:0;min-height:0}.wheelgrid.wide .wheelcol{height:100%}.wheelgrid.wide .wheelbox{flex:1;min-height:0}
.wheelgrid.wide .wheelbox{display:flex;align-items:flex-start;justify-content:center}.wheelgrid.wide .wheelbox svg{height:100%;width:auto;max-width:100%;max-height:100%;margin:0 auto}
.wbar{display:flex;gap:8px;flex-wrap:wrap}
.btabs{margin:6px 0 12px;display:inline-flex}
.wglist{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--panel)}
.wgh,.wgl>summary{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1.2fr) minmax(0,1fr) minmax(0,1.4fr);gap:10px;padding:8px 12px;align-items:baseline}
.wgh{font:600 11px var(--f-body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--line)}
.wgl{border-top:1px solid var(--line)}.wgl:first-of-type{border-top:0}
.wgl>summary{cursor:pointer;list-style:none}.wgl>summary::-webkit-details-marker{display:none}.wgl>summary:hover,.wgl[open]>summary{background:var(--hi)}
.wn{font-weight:600}.wn::before{content:"▸ ";color:var(--muted)}.wgl[open] .wn::before{content:"▾ "}.wt,.wtm{color:var(--muted);font-size:13px}
.wgd{padding:4px 14px 12px 26px}.wgd dl,.wgc dl{display:grid;grid-template-columns:110px minmax(0,1fr);gap:4px 12px;margin:8px 0}.wgd dt,.wgc dt{color:var(--muted);font-size:13px}.wgd dd,.wgc dd{margin:0}
.wgt td,.wgt th{padding:4px 8px;border-bottom:1px solid var(--line);text-align:left}.wgt td.code{font-family:var(--f-code)}
.app.nar .wgh{display:none}.app.nar .wgl>summary{grid-template-columns:minmax(0,1fr) auto;gap:2px 10px}.app.nar .wt{grid-column:1/-1;order:3}.app.nar .wtm{grid-column:1/-1;order:4}.app.nar .btabs{display:flex;overflow-x:auto;max-width:100%}.app.nar .btabs button{white-space:nowrap}.app.nar .wgd dl,.app.nar .wgc dl{grid-template-columns:minmax(0,1fr)}
.train.tgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(280px,380px);gap:18px;max-width:1120px;margin:0 auto;align-items:start}
.app.nar .train.tgrid,.tgrid.one{grid-template-columns:minmax(0,1fr)}
.tside{position:sticky;top:0}.tside h3{margin:10px 0 4px}.tside h3:first-child{margin-top:0}
.tkind{font:600 11px var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 4px}
.ptab,.ctab{width:100%;border-collapse:collapse;font-size:13px}.ptab td,.ctab td,.ctab th{padding:4px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}.ctab th{font-weight:600;font-size:11.5px;color:var(--muted)}.ptab td.num,.ctab .num{text-align:right;font-family:var(--f-code);white-space:nowrap}
.ctab tr.me td{background:var(--hi)}
.pbar{display:block;width:100%;min-width:60px;height:8px;border-radius:4px;background:var(--line);overflow:hidden}.pbar i{display:block;height:100%}
.ptip{font-size:13px;margin:8px 0 0}
.miss{list-style:none;margin:0;padding:0;font-size:12.5px}.miss li{border-bottom:1px solid var(--line);padding:5px 0}.miss .mq{display:block}.miss .ma{display:block;color:var(--muted)}
.tlv button{white-space:nowrap}
.lvrow{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:3px;max-width:460px}
.lvc{border:0;padding:0;background:none;cursor:pointer;border-radius:6px}.lvc[aria-disabled="true"]{cursor:default;opacity:.75}
.lvsw{display:flex;align-items:flex-end;justify-content:center;height:34px;border-radius:6px;font:600 12px var(--f-code);padding-bottom:3px;box-sizing:border-box;box-shadow:inset 0 0 0 1px rgba(127,127,127,.25)}
.lvc.on .lvsw{outline:2.5px solid var(--ink);outline-offset:1px}
.lvcap{margin:4px 0 0;max-width:460px}
.lvtab tr.go{cursor:pointer}.lvtab tr.go:hover td,.lvtab tr.on td{background:var(--hi)}
.wstyle{display:inline-flex;align-self:flex-start;border:1px solid var(--line);border-radius:999px;overflow:hidden}.wstyle button{border:0;background:transparent;color:var(--ink);font:500 12.5px var(--f-body);padding:5px 12px;cursor:pointer}.wstyle button[aria-pressed="true"]{background:var(--ink);color:var(--panel)}
.keybox .kl{font:600 10.5px var(--f-body);fill:#fff;letter-spacing:.04em;pointer-events:none}.keybox .kname{font:700 15px var(--f-body);letter-spacing:.14em;fill:#fff}.keybox .nocode{font:500 12px var(--f-body);fill:var(--muted)}
.wl{pointer-events:none}.wl path{fill:var(--ink);fill-opacity:.94;stroke:var(--panel);stroke-width:1.5}.wl.line path{fill:var(--accent)}.keybox .wl text{fill:var(--panel);font:600 12px var(--f-body)}
.wheel text{font-family:var(--f-code)}
#rot,.up{transition:transform .65s cubic-bezier(.3,.7,.2,1)}
.up,.tan{transform-box:fill-box;transform-origin:center}
@media (prefers-reduced-motion:reduce){#rot,.up,.ringlab{transition:none}}
.sector{cursor:pointer;transition:fill-opacity .3s}
.dot{cursor:pointer;transition:opacity .3s}
.dot rect{stroke:var(--panel);stroke-width:1.5}
.dot text{font-size:13px;font-weight:600;fill:#fff}
.dot.dim{opacity:.42}
.seclab{cursor:pointer;font:700 14px var(--f-body);letter-spacing:.12em;fill:#fff}
#cDisk{transition:fill .4s}
.dot.sel{opacity:1}.dot.sel rect{stroke:var(--ink);stroke-width:3.5}
.famrow.focus{background:var(--hi);border-radius:var(--r);margin-inline:-8px;padding-inline:8px}
.tag.focus{outline:2.5px solid var(--ink);outline-offset:1px}
.why{margin-top:10px;border-top:1px solid var(--line);padding-top:8px}.why summary{cursor:pointer;font-size:13px;color:var(--muted)}
.ringlab{transition:transform .65s cubic-bezier(.3,.7,.2,1);pointer-events:none}.ringlab path{fill:var(--ink);stroke:var(--panel);stroke-width:1.5;fill-opacity:.94}.ringlab.line path{fill:var(--accent)}
td.cl{cursor:pointer}td.cl:hover{background:var(--hi)}td.focus{background:var(--hi);box-shadow:inset 0 0 0 2px var(--ink)}.ringlab.multi{cursor:pointer}.ringlab.line rect{fill:var(--accent)}
.ringlab text{fill:var(--panel);font:600 12.5px var(--f-body)}
.side{display:flex;flex-direction:column;gap:10px;min-width:0;min-height:0}
.wheelgrid.wide .side{height:100%}
.sidebody{overflow:auto;min-height:0;flex:1}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.nlist{display:grid;margin-top:6px}
.nrow{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:start;border-top:1px solid var(--line);padding:8px 6px;cursor:pointer;border-radius:6px}
.nrow.lvrow{grid-template-columns:24px auto minmax(0,1fr)}
.nrow:hover{background:var(--hi)}.nrow.on{background:var(--hi);box-shadow:inset 3px 0 0 var(--accent)}
.nsw{width:26px;height:26px;border-radius:6px;box-shadow:inset 0 0 0 1px rgba(127,127,127,.3)}
.nlv{font:600 15px var(--f-code);text-align:right;padding-top:3px}
.ncodes{display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:4px;font-size:12.5px}
.ncode{display:inline-flex;gap:4px;align-items:center}.ncode .tag{margin:0}
.famlist{display:grid;gap:0;margin-top:6px}
.famrow{display:grid;grid-template-columns:84px minmax(0,1fr);gap:10px;align-items:baseline;border-top:1px solid var(--line);padding-block:8px}
.famrow b{font-weight:600}
.tag{font:600 13px var(--f-code);color:#fff;border-radius:11px;padding:1px 8px;margin:0 6px 3px 0;display:inline-block}
.lines{font-size:12.5px;color:var(--muted);margin-top:2px}
.lines span{white-space:nowrap}
.comp{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13.5px;margin:6px 0 8px}
.pick{display:flex;flex-wrap:wrap;gap:5px}
.pick .chip{padding:3px 9px;font-size:12px}
/* grid */
.chart{display:grid;gap:2px;min-width:900px}
.chart .hd{font:600 11px var(--f-body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:6px 4px;border-bottom:3px solid;position:sticky;top:0;background:var(--bg);z-index:2}
.gridpage{display:flex;flex-direction:column;height:100%;min-height:0}
.gridwrap{flex:1;min-height:0;overflow:auto;margin-top:10px}
.chart .lv{position:sticky;left:0;background:var(--bg);z-index:1}
.chart .hd:first-child{left:0;z-index:3}
.chart .lv{font-family:var(--f-code);font-size:12px;padding:6px 4px;color:var(--muted);border-top:1px solid var(--line)}
.chart .lv b{display:block;font-size:20px;color:var(--ink);font-weight:500}
.cell{border-top:1px solid var(--line);padding:4px 2px;display:flex;flex-wrap:wrap;gap:4px;align-content:flex-start;min-height:52px}
.sw{border:0;padding:0;background:none;cursor:pointer;width:100%;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--ink)}
.sw span.s{width:100%;height:34px;border-radius:4px;box-shadow:inset 0 0 0 1px rgba(127,127,127,.25);position:relative}
.sw span.s em{position:absolute;left:3px;top:1px;font:600 10px var(--f-code);font-style:normal;color:#fff;text-shadow:0 0 2px #000}
.sw span.c{font:500 10.5px var(--f-code);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.sw:hover span.s{outline:2px solid var(--accent)}
.famtabs{display:none}
.cell{flex-direction:column;flex-wrap:nowrap;gap:5px}
.lgrp{display:flex;flex-direction:column;gap:2px;min-width:0}
.lh{font:500 10px var(--f-body);color:var(--muted);letter-spacing:.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lh b{font-family:var(--f-code);color:var(--ink)}
.lchips{display:grid;grid-template-columns:repeat(auto-fill,minmax(58px,1fr));gap:6px 5px}
.swrap{min-width:0}.sibs{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:6px}.pchips .swrap{width:64px}
.bgrp{display:inline-flex}
.bgrp.multi .bchip{border-top-right-radius:0;border-bottom-right-radius:0;border-right:0}
.dd{border-top-left-radius:0;border-bottom-left-radius:0;padding:5px 9px;font-family:var(--f-code);font-size:12px;color:var(--ink)}
.pop{position:absolute;z-index:30;width:270px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 10px 30px rgba(0,0,0,.18);padding:12px 14px}
.lrow{display:flex;gap:8px;align-items:baseline;padding:5px 0;font-size:14px;cursor:pointer;border-top:1px solid var(--line)}
.lrow small{color:var(--muted);font-size:11.5px;margin-left:auto;white-space:nowrap}
.lrow input{accent-color:var(--ink)}
.light{display:flex;gap:12px;align-items:flex-start;padding:10px 14px;border-radius:var(--r);border:1px solid;font-size:14px}
.light .lamp{width:16px;height:16px;border-radius:50%;flex:none;margin-top:2px;box-shadow:0 0 0 3px var(--panel)}
.light .chip{margin-top:6px;color:var(--ink);border-color:var(--ink)}
.light.good{border-color:var(--good);background:color-mix(in srgb,var(--good) 10%,var(--panel))}.light.good .lamp{background:var(--good)}
.light.fair{border-color:var(--amber);background:color-mix(in srgb,var(--amber) 14%,var(--panel))}.light.fair .lamp{background:var(--amber)}
.light.poor{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--panel))}.light.poor .lamp{background:var(--bad)}
.lbl.tier{display:inline-flex;align-items:center;gap:6px}.lbl.tier::before{content:"";width:9px;height:9px;border-radius:50%}
.lbl.tier.good::before{background:var(--good)}.lbl.tier.fair::before{background:var(--amber)}.lbl.tier.poor::before{background:var(--bad)}
.savedwrap{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:760px){.savedwrap{grid-template-columns:minmax(0,1fr)}}
.plistcol{display:flex;flex-direction:column;gap:8px}
.plist{display:grid;gap:3px;text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:var(--r);padding:10px 12px;cursor:pointer;color:var(--ink);font:inherit}
.plist.sel{border-color:var(--ink);box-shadow:inset 3px 0 0 var(--accent)}
.pl-name{font:600 15px var(--f-body)}.pl-meta{font-size:12px;color:var(--muted)}
.pl-sw{display:flex;gap:3px}.pl-sw i{width:16px;height:12px;border-radius:2px;box-shadow:inset 0 0 0 1px rgba(127,127,127,.3)}
.pdetail{display:flex;flex-direction:column;gap:12px;margin-top:12px}
.pgrp{display:flex;flex-direction:column;gap:4px}
.prow{display:grid;grid-template-columns:44px 90px minmax(0,1fr) auto;gap:10px;align-items:center;border-top:1px solid var(--line);padding-top:6px}
.plink{border:0;background:none;padding:0;font:500 15px var(--f-code);color:var(--accent);text-align:left;cursor:pointer;text-decoration:underline}
.rm2{border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:999px;font:500 12px var(--f-body);padding:3px 10px;cursor:pointer}
.collect{display:flex;align-items:center;gap:2px;border-left:1px solid var(--line);padding-left:10px;font:500 13px var(--f-body);color:var(--muted)}
.savedseg.on .collect{background:var(--hi);color:var(--ink)}

<body>


<div class="framecap" id="framecap"></div>
<div class="devbar" id="devbar" role="group" aria-label="Preview device" hidden><span>Preview</span><button data-dev="ipad">iPad</button><button data-dev="phone">iPhone</button><button data-dev="off">Off</button></div>
<div class="app" id="app">
<header>
  <div class="wrap row">
    <h1>Rosetta Tone Lab</h1>
    <div class="navscroll">
    <div class="seg" role="group" aria-label="View">
      <button id="v-wheel" data-v="wheel">Tone wheel</button>
      <button id="v-translate" data-v="translate">Translate</button>
      <button id="v-grid" data-v="grid">Chip grid</button>
      <button id="v-depth" data-v="depth">Depth ladder</button>
      <button id="v-brands" data-v="brands">Brands</button>
    </div>
    <div class="seg savedseg" role="group" aria-label="Saved profiles" id="collectBox">
      <button id="v-saved" data-v="saved">Saved</button>
      <label class="collect"><span class="sr">Collect shades into</span><span aria-hidden="true">+ to</span><select id="collectSel"></select></label>
    </div>
    </div>
    <span class="spacer"></span>
    <div class="seg" role="group" aria-label="Training">
      <button id="v-train" data-v="train">Train</button>
    </div>
    <div class="seg" role="group" aria-label="Colour theme">
      <button id="themeBtn" type="button" aria-label="Switch to dark mode" title="Switch to dark mode">Dark</button>
    </div>
  </div>
  <div class="wrap row" id="filterRow">
    <span class="lbl">Brands</span><div class="chips" id="brandChips"></div>
    <span class="lbl" id="typeLbl">Products</span><div class="chips" id="typeChips"></div>
  </div>
</header>
<main class="wrap" id="main"><p class="note">Loading shade data…</p></main>
<div class="sheet" id="sheet" hidden></div>
</div>

<script>
const FAMCOL={red:"#b3322b",copper:"#cf6a26",gold:"#c99a1f",green:"#5d8a4c",ash:"#4f78a6",pearl:"#7570aa",violet:"#6d4790",mahogany:"#7b2948",natural:"#9a8466",brown:"#6b4a33",clear:"#aab0b3"};
const WHEEL_ORDER=["red","copper","gold","green","ash","pearl","violet","mahogany"];
const GRID_ORDER=["natural","brown","gold","copper","red","mahogany","violet","pearl","ash","green","clear"];
const CAT={koleston:"perm",inoa:"perm",majirel:"perm",creative:"perm",blended:"perm",reflect:"perm",extra:"perm",ultra:"perm",dialight:"demi",diacolor:"demi",gloss:"demi",shadeseq:"demi",mixmaster:"add"};
const CATNAME={perm:"Permanent",demi:"Demi / gloss",add:"Additives"};
const LV_LABEL=d=>d===0?"Mix":String(d);
const C=360,R1=300,R0=80;
let DATA,FAM;
const S={view:"wheel",brands:new Set(),cats:new Set(["perm","demi","add"]),fam:"violet",gridFam:"natural",brand:null,rot:0,side:"fam",frame:null,focus:null,lines:null,collect:null,openProf:null,wstyle:"key",wmode:"tones",unw:"yellow",lvl:null};
const LSHORT={inoa:"iNOA",majirel:"Majirel",dialight:"Dia Light",diacolor:"Dia Color",koleston:"Koleston",creative:"creative + lift",gloss:"gloss",mixmaster:"mix master",blended:"Blended",reflect:"Reflect",extra:"Extra Coverage",ultra:"Ultra Blonde",shadeseq:"Shades EQ"};
const DEFAULT_LINES=["inoa","koleston","creative","blended","shadeseq"];
const lineOn=l=>S.lines.has(l.id);
const store={get(k){try{return JSON.parse(localStorage.getItem("rosetta:"+k))}catch(e){return null}},set(k,v){try{localStorage.setItem("rosetta:"+k,JSON.stringify(v))}catch(e){}}};
const $=s=>document.querySelector(s);
(function(){const btn=document.getElementById("themeBtn");if(!btn)return;const mq=window.matchMedia?matchMedia("(prefers-color-scheme: dark)"):null;
const cur=()=>document.documentElement.dataset.theme||(mq&&mq.matches?"dark":"light");
const paint=()=>{const next=cur()==="dark"?"light":"dark";btn.textContent=next==="dark"?"Dark":"Light";btn.setAttribute("aria-label","Switch to "+next+" mode");btn.title="Switch to "+next+" mode"};
const saved=store.get("theme");if(saved==="light"||saved==="dark")document.documentElement.dataset.theme=saved;
btn.addEventListener("click",()=>{const t=cur()==="dark"?"light":"dark";document.documentElement.dataset.theme=t;store.set("theme",t);paint()});
if(mq&&mq.addEventListener)mq.addEventListener("change",paint);paint()})();
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const famShort=f=>FAM[f].name.split(" /")[0];

fetch("data/rosetta.json").then(r=>r.json()).then(d=>{DATA=d;FAM=d.families;init()}).catch(()=>{$("#main").innerHTML='<p class="warn">The shade data file did not load. Reload the page to try again.</p>'});

function init(){
  const saved=store.get("state")||{};
  DATA.brands.forEach(b=>S.brands.add(b.id));
  if(saved.brands){S.brands=new Set(saved.brands.filter(id=>DATA.brands.some(b=>b.id===id)));if(!S.brands.size)DATA.brands.forEach(b=>S.brands.add(b.id))}
  if(saved.cats)S.cats=new Set(saved.cats);
  if(saved.view)S.view=saved.view;
  if(saved.fam&&FAM[saved.fam])S.fam=saved.fam;
  if(typeof saved.frame==="boolean")S.frame=saved.frame?"ipad":"off";else if(["ipad","phone","off"].includes(saved.frame))S.frame=saved.frame;if(saved.wstyle==="full"||saved.wstyle==="key")S.wstyle=saved.wstyle;if(saved.wmode==="neut")S.wmode="neut";if(saved.unw&&NP[saved.unw])S.unw=saved.unw;if(saved.lvl&&WUP[saved.lvl])S.lvl=saved.lvl;
  computeSectors();S.rot=targetRot(S.fam,0);if(S.wmode==="neut"){S.fam=NP[S.unw].n[0];S.rot=rotTo(circMean(NP[S.unw].n),0)}S.lines=new Set(saved.lines||DEFAULT_LINES);DATA.brands.forEach(b=>{if(!b.lines.some(lineOn))S.lines.add(b.lines[0].id)});
  document.addEventListener("click",e=>{const pop=$("#pop");if(pop&&!pop.hidden&&!e.target.closest("#pop,.dd"))pop.hidden=true});
  const h=location.hash.slice(1);
  if(["wheel","grid","depth","brands","saved","train","translate"].includes(h))S.view=h;else if(h.startsWith("b-")){S.view="brands";S.brand=h.slice(2)}
  document.querySelectorAll(".seg button[data-v]").forEach(b=>b.onclick=()=>{S.view=b.dataset.v;if(S.view!=="brands")S.brand=null;render()});
  document.querySelectorAll("#devbar [data-dev]").forEach(x=>x.onclick=()=>{S.frame=x.dataset.dev;applyFrame();render()});
  S.collect=store.get("collect")||null;{const tl=store.get("train-level");if(LEVELS[tl])T.level=tl}applyFrame();render();startDb();startScores();
}
function canDev(d){return d==="ipad"?innerWidth>=1240&&innerHeight>=880:d==="phone"?innerWidth>=480&&innerHeight>=620:true}
function device(){const d=S.frame==null?"ipad":S.frame;return d!=="off"&&canDev(d)?d:"off"}
function framed(){return device()!=="off"}
function applyFrame(){const d=device();document.body.classList.toggle("framed",d!=="off");document.body.classList.toggle("phone",d==="phone");
  const bar=$("#devbar");bar.hidden=!canDev("phone");bar.querySelectorAll("[data-dev]").forEach(x=>{x.setAttribute("aria-pressed",x.dataset.dev===d);x.hidden=!canDev(x.dataset.dev)});
  $("#framecap").textContent=d==="phone"?"iPhone · 390 × 844 (Safari shows about 390 × 660 once its bars are in view)":"iPad landscape · 1180 × 820 (Safari viewport, about 1180 × 750 once the browser bar is shown)";
  const app=$("#app");app.classList.toggle("nar",app.clientWidth<640)}
function save(){store.set("state",{brands:[...S.brands],cats:[...S.cats],view:S.view,fam:S.fam,frame:S.frame,lines:[...S.lines],wstyle:S.wstyle,wmode:S.wmode,unw:S.unw,lvl:S.lvl})}
const brands=()=>DATA.brands.filter(b=>S.brands.has(b.id));
function shades(b){const out=[];b.lines.forEach(l=>{if(!S.cats.has(CAT[l.id])||!lineOn(l))return;l.shades.forEach(s=>{if(b.id==="wella"&&s.depth===0&&!S.cats.has("add"))return;out.push({...s,brand:b,line:l})})});return out}
const famOf=s=>s.fams[0];
function symFor(b,k){const t=b.tone_key.tones[k];if(b.id==="loreal")return t.digit+" "+t.letter;if(b.tone_key.system==="letters")return t.letter;return t.digit}

function renderFilters(){
  $("#brandChips").innerHTML=DATA.brands.map(b=>{const on=b.lines.filter(lineOn).length,multi=b.lines.length>1;
    return`<span class="bgrp${multi?" multi":""}"><button class="chip bchip" id="bc-${b.id}" aria-pressed="${S.brands.has(b.id)}" data-b="${b.id}"><span class="k">${b.short[0]}</span>${esc(b.short)}</button>${multi?`<button class="chip dd" data-dd="${b.id}" aria-expanded="false" aria-label="Choose ${esc(b.short)} product lines">${on}/${b.lines.length} ▾</button>`:""}</span>`}).join("")+`<div class="pop" id="pop" hidden></div>`;
  $("#brandChips").querySelectorAll(".bchip").forEach(x=>x.onclick=()=>{const id=x.dataset.b;if(S.brands.has(id)){if(S.brands.size>1)S.brands.delete(id)}else S.brands.add(id);render()});
  $("#brandChips").querySelectorAll(".dd").forEach(x=>x.onclick=e=>{e.stopPropagation();openLines(x)});
  $("#filterRow").hidden=!["wheel","grid","depth"].includes(S.view);
  const showT=S.view==="grid";$("#typeLbl").hidden=!showT;$("#typeChips").hidden=!showT;
  $("#typeChips").innerHTML=Object.entries(CATNAME).map(([k,v])=>`<button class="chip" id="tc-${k}" aria-pressed="${S.cats.has(k)}" data-c="${k}">${v}</button>`).join("");
  $("#typeChips").querySelectorAll("button").forEach(x=>x.onclick=()=>{const c=x.dataset.c;if(S.cats.has(c)){if(S.cats.size>1)S.cats.delete(c)}else S.cats.add(c);render()});
  document.querySelectorAll(".seg button[data-v]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.v===S.view));
}
function openLines(btn){const b=DATA.brands.find(x=>x.id===btn.dataset.dd),pop=$("#pop");
  if(!pop.hidden&&pop.dataset.b===b.id){pop.hidden=true;return}
  pop.dataset.b=b.id;pop.hidden=false;
  pop.innerHTML=`<p class="lbl" style="margin:0 0 6px">${esc(b.name)} lines</p>`+b.lines.map(l=>`<label class="lrow"><input type="checkbox" id="ln-${l.id}" data-l="${l.id}" ${lineOn(l)?"checked":""}> <span>${esc(LSHORT[l.id]||l.name)}</span> <small>${esc(l.type.split(",")[0])} · ${l.shades.length}</small></label><button class="cmp" data-cmp="${l.id}">Compare with similar lines in every brand</button>`).join("")+`<p class="note" style="margin:6px 0 0">Each line switched on gets its own ring on the tone wheel.</p>`;
  const r=btn.getBoundingClientRect(),a=$("#app").getBoundingClientRect();pop.style.left=Math.max(8,Math.min(r.left-a.left,a.width-312))+"px";pop.style.top=(r.bottom-a.top+6)+"px";
  pop.querySelectorAll("[data-cmp]").forEach(x=>x.onclick=()=>{const lid=x.dataset.cmp,g=COMP[lid];
    DATA.brands.forEach(bb=>{if(bb.lines.length<2)return;const pick=bb.id===b.id?[lid]:bb.lines.filter(l=>COMP[l.id]===g).map(l=>l.id);const use=pick.length?pick:[bb.lines[0].id];bb.lines.forEach(l=>S.lines.delete(l.id));use.forEach(id=>S.lines.add(id))});
    pop.hidden=true;render()});
  pop.querySelectorAll("input").forEach(i=>i.onchange=()=>{const id=i.dataset.l;if(i.checked)S.lines.add(id);else{if(b.lines.filter(lineOn).length>1)S.lines.delete(id);else i.checked=true}
    const keep=b.id;render();const nb=document.querySelector(`.dd[data-dd="${keep}"]`);if(nb)openLines(nb)});
}
function render(){
  renderFilters();renderCollect();save();
  const m=$("#main");m.classList.toggle("fit",false);
  if(S.view==="wheel"){m.innerHTML=wheelView();layoutWheel();if(S.wstyle==="key")keyStart()}
  else if(S.view==="grid"){m.innerHTML=gridView();m.classList.add("fit")}
  else if(S.view==="depth")m.innerHTML=depthView();
  else if(S.view==="saved")m.innerHTML=savedView();
  else if(S.view==="train")m.innerHTML=trainView();
  else if(S.view==="translate")m.innerHTML=translateView();
  else m.innerHTML=brandView();
  bind();
}

/* ---------- tone wheel ---------- */
let MID={},BOUNDS={},RX=[];
function computeSectors(){WHEEL_ORDER.forEach((f,i)=>{const h=FAM[f].hue,prev=FAM[WHEEL_ORDER[(i+7)%8]].hue,next=FAM[WHEEL_ORDER[(i+1)%8]].hue;
  const a0=h-((h-prev+360)%360)/2,a1=h+((next-h+360)%360)/2;BOUNDS[f]=[a0,a1];MID[f]=(a0+a1)/2})}
function pol(r,deg){const a=(deg-90)*Math.PI/180;return[C+r*Math.cos(a),C+r*Math.sin(a)]}
function arc(r0,r1,a0,a1){const[x0,y0]=pol(r1,a0),[x1,y1]=pol(r1,a1),[x2,y2]=pol(r0,a1),[x3,y3]=pol(r0,a0);const lg=(a1-a0)>180?1:0;return`M${x0},${y0}A${r1},${r1} 0 ${lg} 1 ${x1},${y1}L${x2},${y2}A${r0},${r0} 0 ${lg} 0 ${x3},${y3}Z`}
function targetRot(f,cur){if(MID[f]==null)return cur;let t=180-MID[f],d=((t-cur)%360+540)%360-180;return cur+d}
function up(x,y,inner){return`<g transform="translate(${x.toFixed(1)},${y.toFixed(1)})"><g class="up" style="transform:rotate(${-S.rot}deg)">${inner}</g></g>`}
function rings(){const out=[];brands().forEach(b=>{if(b.lines.length===1){out.push({b,l:null,first:true,n:1});return}const ls=b.lines.filter(lineOn);ls.forEach((l,j)=>out.push({b,l,first:j===0,n:ls.length}))});return out}
function ringKeys(ring){const keys=Object.keys(ring.b.tone_key.tones);if(!ring.l)return keys;const used=new Set();ring.l.shades.forEach(s=>s.tones.forEach(t=>used.add(t)));return keys.filter(k=>used.has(k))}
function wheelSvg(){

function brandView(){

  if(!b)return`${nav}<h2>Brand summaries</h2><div class="cards">${DATA.brands.map(x=>`<a class="panel" href="#b-${x.id}" data-brand="${x.id}" style="text-decoration:none;color:inherit"><h3>${esc(x.name)}</h3><p class="code" style="font-size:20px;margin:4px 0">${esc(x.code_example)}</p><p class="note">${x.lines.map(l=>esc(l.name)).join(" · ")}</p><p class="note">${x.lines.reduce((a,l)=>a+l.shades.length,0)} shades · ${esc(x.market)}</p></a>`).join("")}</div>`;
  const tk=b.tone_key;
  const toneRows=Object.entries(tk.tones).map(([k,t])=>`<tr><td class="num">${esc(symFor(b,k))}</td><td>${esc(t.label)}</td><td><span class="fam"><i style="background:${FAMCOL[t.fam]}"></i>${esc(FAM[t.fam].name)}</span></td></tr>`).join("");
  const depth=Object.entries(b.depth_names).map(([k,v])=>`<tr><td class="num">${k}</td><td>${esc(v)}</td></tr>`).join("");
  const lines=b.lines.map(l=>`<section class="panel"><h3>${esc(l.name)}</h3><p class="note">${esc(l.type)} · ${l.shades.length} shades</p><dl><dt>Mixing ratio</dt><dd>${esc(l.ratio)}</dd><dt>Developers</dt><dd>${Object.entries(l.developers).map(([k,v])=>`<b class="code" style="font-weight:500">${esc(k)}</b>: ${esc(v)}`).join("<br>")}</dd><dt>Time</dt><dd>${esc(l.time)}</dd>${l.grey?`<dt>Grey</dt><dd>${esc(l.grey)}</dd>`:""}<dt>Source</dt><dd class="note">${esc(l.source)}</dd></dl>${l.warnings.map(w=>`<p class="warn" style="margin:10px 0 0">${esc(w)}</p>`).join("")}</section>`).join("");
  const wt=b.id==="wella"?`<div class="seg btabs" role="group" aria-label="Wella pages">${[["over","Overview"],["mix","Mixing & developers"],["corr","Corrective recipes"]].map(([k,v])=>`<button data-btab="${k}" aria-pressed="${(S.btab||"over")===k}">${v}</button>`).join("")}</div>`:"";
  if(b.id==="wella"&&S.btab==="mix")return`${nav}<h2>${esc(b.name)}</h2>${wt}${wgMix()}`;
  if(b.id==="wella"&&S.btab==="corr")return`${nav}<h2>${esc(b.name)}</h2>${wt}${wgCorr()}`;
  return`${nav}<h2>${esc(b.name)}</h2>${wt}<p style="max-width:70ch">${esc(b.code_format)}</p><p class="note">${esc(b.market)}</p>
  <div class="cards"><section class="panel"><h3>Tone key</h3><div class="scroll"><table><thead><tr><th>Code</th><th>Brand name</th><th>Family</th></tr></thead><tbody>${toneRows}</tbody></table></div><p class="note">Source: ${esc(tk.key_source)}. Wheel position: ${esc(tk.hue_source)}.</p></section>
  <section class="panel"><h3>Levels</h3><div class="scroll"><table><tbody>${depth}</tbody></table></div><p class="note">Source: ${esc(b.depth_source)}</p></section></div>

function wgMix(){

  const row=l=>{const t=l.time[0]||{};return`<details class="wgl"><summary><span class="wn">${esc(l.name)}</span><span class="wt">${esc(l.type)}</span><span class="wr code">${esc(l.mix.map(m=>m.ratio).filter((v,i,a)=>a.indexOf(v)===i).join(" / "))}</span><span class="wtm">${esc(t.noheat||"")}${t.heat?` · heat ${esc(t.heat)}`:""}</span></summary>
    <div class="wgd"><p>${esc(l.summary)}</p><dl><dt>Mixing</dt><dd>${l.mix.map(m=>`<b>${esc(m.for)}</b>: <span class="code">${esc(m.ratio)}</span>${m.eg?` (${esc(m.eg)})`:""}`).join("<br>")}</dd>
    ${l.dev.length?`<dt>Developer</dt><dd>${l.dev.map(d=>`<b class="code" style="font-weight:500">${esc(d.d)}</b>: ${esc(d.use)}`).join("<br>")}</dd>`:""}
    <dt>Development</dt><dd>${l.time.map(t=>`<b>${esc(t.for)}</b>: ${t.noheat?`${esc(t.noheat)}${t.heat?" without heat":""}`:""}${t.heat?`; ${esc(t.heat)} with heat`:""}`).join("<br>")}</dd>
    ${l.apply?`<dt>Application</dt><dd>${esc(l.apply)}</dd>`:""}<dt>Source</dt><dd class="note">${esc(l.pg)}</dd></dl></div></details>`};
  return`<p class="note" style="max-width:75ch">Every Wella line in the workbook, with its mixing ratio and development time. Tap a line for developers and details.</p>
  ${grp.map(([n,f])=>{const ls=WG.lines.filter(f);return ls.length?`<h3 style="margin-top:16px">${n}</h3><div class="wglist"><div class="wgh"><span>Line</span><span>Type</span><span>Ratio</span><span>Time (no heat)</span></div>${ls.map(row).join("")}</div>`:""}).join("")}${WGSRC}`}
function wgCorr(){
  const card=c=>`<section class="panel wgc"><h3>${esc(c.name)}</h3><p>${esc(c.when)}</p><dl><dt>Mix</dt><dd>${esc(c.mix)}</dd><dt>Apply</dt><dd>${esc(c.apply)}</dd><dt>Develop</dt><dd>${esc(c.time)}</dd><dt>Remove</dt><dd>${esc(c.remove)}</dd></dl>
    ${c.table?`<div class="scroll"><table class="wgt"><thead><tr>${c.tableHead.map(h=>`<th>${esc(h)}</th>`).join("")}</tr></thead><tbody>${c.table.map(r=>`<tr><td class="num">${esc(r[0])}</td><td class="code">${esc(r[1])}</td></tr>`).join("")}</tbody></table></div>`:""}
    ${c.tip?`<p class="note">${esc(c.tip)}</p>`:""}${c.conflict?`<p class="warn">Sources differ: ${esc(c.conflict)}</p>`:""}<p class="note">Source: ${esc(c.pg)}</p></section>`;
  const G=["Darkening","Pre-pigmentation","Removing colour"];
  return`<p class="note" style="max-width:75ch">Going darker on lightened hair needs the missing warm pigment put back first (pre-pigmentation or filling), or the result goes flat or green. Removing colour uses a mild lightener or Color Renew.</p>
  ${G.map(g=>`<h3 style="margin-top:16px">${g}</h3><div class="cards">${WG.corrective.filter(c=>c.group===g).map(card).join("")}</div>`).join("")}${WGSRC}`}

  document.querySelectorAll("#rot .dot").forEach(x=>x.addEventListener("click",()=>{if(isNeut()){S.focus={b:x.dataset.b,k:x.dataset.k};document.querySelectorAll("#rot .dot").forEach(d=>d.classList.toggle("sel",d===x));refreshSide()}else setFam(x.dataset.fam,{b:x.dataset.b,k:x.dataset.k})}));
  if($("#side"))bindSide();
  if($("#key"))kBindH();
  document.querySelectorAll("[data-wm]").forEach(x=>x.onclick=()=>setWMode(x.dataset.wm));
  if($("#lvstrip"))bindStrip();
  document.querySelectorAll("[data-ws]").forEach(x=>x.onclick=()=>{if(S.wstyle===x.dataset.ws)return;S.wstyle=x.dataset.ws;render()});
  document.querySelectorAll("[data-gfam]").forEach(x=>x.onclick=()=>{S.gridFam=x.dataset.gfam;render()});
  document.querySelectorAll("#main .sw").forEach(x=>x.onclick=()=>openSheet(x.dataset.b,x.dataset.l,x.dataset.code));
  document.querySelectorAll("[data-brand]").forEach(x=>x.onclick=e=>{e.preventDefault();S.brand=x.dataset.brand;render();$("#main").scrollTop=0});
  document.querySelectorAll("[data-btab]").forEach(x=>x.onclick=()=>{S.btab=x.dataset.btab;render();$("#main").scrollTop=0});
}
addEventListener("hashchange",()=>{const h=location.hash.slice(1);if(["wheel","grid","depth","brands"].includes(h)){S.view=h;render()}else if(h.startsWith("b-")){S.view="brands";S.brand=h.slice(2);render()}});
let rt;addEventListener("resize",()=>{clearTimeout(rt);rt=setTimeout(()=>{applyFrame();if(S.view==="wheel")layoutWheel();else if(S.view==="grid")render()},150)});
</script>

</body>
</html>
